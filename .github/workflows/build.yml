name: Build, test, and publish

on:
  release:
    types:
      - published
  workflow_dispatch: {}
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  FINAL_IMAGE: ghcr.io/${{ github.repository_owner }}/ihp-oci:latest
  TEST_IMAGE: ghcr.io/${{ github.repository }}/build-test-${{ github.run_id }}:candidate
  TEST_PACKAGE: ihp-oci%2Fbuild-test-${{ github.run_id }}

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v7.0.1

      - name: Docker setup
        uses: ./.github/actions/docker-setup
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build candidate image
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Verify image
        uses: ./.github/actions/verify-image
        with:
          image: ${{ env.TEST_IMAGE }}
          expected-packages: ihp-new direnv devenv
          expected-paths: |
            $HOME/.nix-profile/share/nix-direnv

      - name: Clean up old images
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/cleanup-old-images.sh ihp-oci latest

      - name: Promote tested image to :latest
        run: docker buildx imagetools create -t "$FINAL_IMAGE" "$TEST_IMAGE"

      - name: Remove temporary build package
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --method DELETE "/user/packages/container/$TEST_PACKAGE"; then
            echo "Deleted temporary package: $TEST_PACKAGE"
          else
            echo "::warning::Failed to delete temporary package: $TEST_PACKAGE"
          fi

      - name: Show build summary
        if: always()
        run: |
          echo "Build ID: ${{ github.run_id }}"
          echo "Image: $FINAL_IMAGE"
          echo "Result: ${{ job.status }}"
