name: PR build test

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: test
  PACKAGE_NAME: pr-test-${{ github.run_id }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: pr-testing

    steps:
      - name: Check out repo
        uses: actions/checkout@v7.0.1

      - name: Docker setup
        uses: ./.github/actions/docker-setup
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build multi-arch image
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ env.PACKAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Verify image
        uses: ./.github/actions/verify-image
        with:
          image: ghcr.io/${{ github.repository }}/${{ env.PACKAGE_NAME }}:${{ env.IMAGE_TAG }}
          expected-packages: ihp-new direnv devenv
          expected-paths: |
            $HOME/.nix-profile/share/nix-direnv

      - name: Remove temporary package
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API_PACKAGE_NAME="ihp-oci%2F$PACKAGE_NAME"
          if gh api --method DELETE "/user/packages/container/$API_PACKAGE_NAME"; then
            echo "Deleted package: ihp-oci/$PACKAGE_NAME"
          else
            echo "::warning::Failed to delete package: ihp-oci/$PACKAGE_NAME"
          fi

      - name: Show build summary
        if: always()
        run: |
          echo "Build ID: ${{ github.run_id }}"
          echo "Image: ghcr.io/${{ github.repository }}/${{ env.PACKAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "Result: ${{ job.status }}"
