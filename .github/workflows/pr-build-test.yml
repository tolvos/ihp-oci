name: Image builds and packages are available

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: test
  PACKAGE_NAME: ihp-oci-test-${{ github.run_id }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: pr-testing
    steps:
      - name: Check out repo
        uses: actions/checkout@v7.0.1

      - name: QEMU setup
        uses: docker/setup-qemu-action@v4.2.0

      - name: Buildx setup
        uses: docker/setup-buildx-action@v4.2.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build multi-arch image
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ env.PACKAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Verify packages on all architectures
        run: |
          OVERALL_FAILED=0
          IMAGE="ghcr.io/${{ github.repository }}/${{ env.PACKAGE_NAME }}:${{ env.IMAGE_TAG }}"

          check() {
            local arch="$1"
            local description="$2"
            local command="$3"

            if docker run --rm \
                --platform "linux/$arch" \
                --user developer \
                --entrypoint /bin/bash \
                "$IMAGE" \
                -lc "$command"; then
              echo "✓ [$description] found on $arch"
            else
              echo "✗ FAILED: [$description] NOT FOUND on $arch"
              return 1
            fi
          }

          for arch in amd64 arm64; do
            FAILED=0
            echo ""
            echo "=== Testing $arch ==="

            for pkg in ihp-new direnv devenv; do
              check "$arch" "$pkg" \
                "command -v $pkg >/dev/null 2>&1" || FAILED=1
            done

            check "$arch" "nix-direnv" \
              'test -d "$HOME/.nix-profile/share/nix-direnv"' || FAILED=1

            if [ "$FAILED" -eq 1 ]; then
              echo "ERROR: One or more packages missing on $arch"
              OVERALL_FAILED=1
            else
              echo "SUCCESS: All packages verified on $arch"
            fi
          done

          exit "$OVERALL_FAILED"

      - name: Clean up temporary image
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Cleaning up temporary package: $PACKAGE_NAME"

          if gh api \
              --method DELETE \
              "/user/packages/container/$PACKAGE_NAME"; then
            echo "Deleted package: $PACKAGE_NAME"
          else
            echo "::warning::Failed to delete package: $PACKAGE_NAME"
          fi

      - name: Show build summary
        if: always()
        run: |
          echo "Build ID: ${{ github.run_id }}"
          echo "Image: ghcr.io/${{ github.repository }}/${{ env.PACKAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "Result: ${{ job.status }}"
