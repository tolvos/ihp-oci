name: Image builds and packages are available

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: pr-testing
    steps:
      - name: Check out repo
        uses: actions/checkout@v7.0.1

      - name: QEMU setup
        uses: docker/setup-qemu-action@v4.2.0
        
      - name: Buildx setup
        uses: docker/setup-buildx-action@v4.2.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Build multi-arch image
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          load: true  # Load into local Docker daemon
          tags: ihp-oci:test
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Verify packages on all architectures
        run: |
          FAIL_FLAG=0
          for arch in amd64 arm64; do
            echo "=== $arch ==="
            
            FAILED=0
            for pkg in ihp-new direnv nix-direnv devenv; do
              if docker run --rm --platform linux/$arch ihp-oci:test bash -lc "which $pkg >/dev/null 2>&1"; then
                echo "✓ [$pkg] found on $arch"
              else
                echo "✗ FAILED: [$pkg] NOT FOUND on $arch"
                FAILED=1
              fi
            done
            
            if [ $FAILED -eq 1 ]; then
              echo "ERROR: One or more packages missing on $arch"
              FAIL_FLAG=1
            else
              echo "SUCCESS: All packages verified on $arch"
            fi
          done
          
          exit $FAIL_FLAG

      - name: Inspect final image
        run: |
          docker image inspect ihp-oci:test --format '{{json .Os}}/{{json .Architecture}}'
